<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>

    <meta charset="UTF-8">

    <title th:text="'LAYER | ' + ${brand}"></title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/shop.css">

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="shop-page">

    <section class="shop-hero">

        <h1 th:text="${brand}">
            BRAND
        </h1>

        <p>

            <strong th:text="${count}"></strong>

            Products

        </p>

    </section>

    <section class="shop-grid">

        <article class="shop-card"

                 th:each="product : ${products}">

            <a th:href="@{/product/{id}(id=${product.id})}">

                <div class="shop-image">

                    <img th:src="@{/images/{img}(img=${product.image})}"
                         th:alt="${product.name}">

                </div>

                <div class="shop-info">

                    <span class="brand"

                          th:text="${product.brand}">
                    </span>

                    <h3 th:text="${product.name}">
                    </h3>

                    <strong th:text="${#numbers.formatInteger(product.price,3,'COMMA')}+'원'">
                    </strong>

                </div>

            </a>

        </article>

    </section>

</main>

</body>

</html>
