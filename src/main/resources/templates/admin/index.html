<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <meta charset="UTF-8">

    <title>관리자 대시보드</title>

    <link rel="stylesheet" href="/css/admin.css">

</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

<!-- Main -->
<div class="admin-main">

    <!-- Header -->
    <div th:replace="~{fragments/admin-header :: header}"></div>

    <!-- Content -->
    <main class="content">

        <!-- 제목 -->
        <section class="page-title">

            <div>

                <h1>Dashboard</h1>

                <p>쇼핑몰 운영 현황을 한눈에 확인하세요.</p>

            </div>

        </section>

        <!-- KPI -->
        <section class="dashboard-summary">

            <div class="summary-card">

                <span>총 상품</span>

                <strong th:text="${productCount}">0</strong>

            </div>

            <div class="summary-card">

                <span>총 회원</span>

                <strong th:text="${memberCount}">0</strong>

            </div>

            <div class="summary-card">

                <span>오늘 주문</span>

                <strong th:text="${todayOrderCount}">0</strong>

            </div>

            <div class="summary-card">

                <span>오늘 매출</span>

                <strong th:text="${todaySales}">₩0</strong>

            </div>

        </section>

        <!-- 아래 영역 -->
        <section class="dashboard-grid">

            <!-- 최근 주문 -->
            <div class="dashboard-panel">

                <div class="panel-header">

                    <h2>최근 주문</h2>

                    <a th:href="@{/admin/order}">
                        전체보기 →
                    </a>

                </div>

                <table>

                    <thead>

                    <tr>

                        <th>주문번호</th>

                        <th>회원</th>

                        <th>주문일</th>

                        <th>상태</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="order : ${recentOrders}">

                        <td th:text="${order.id}"></td>

                        <td th:text="${order.member.username}"></td>

                        <td th:text="${order.orderDate}"></td>

                        <td>

                            <span class="status"
                                  th:text="${order.status}">
                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <!-- 재고 부족 -->
            <div class="dashboard-panel">

                <div class="panel-header">

                    <h2>재고 부족 상품</h2>

                </div>

                <table>

                    <thead>

                    <tr>

                        <th>상품명</th>

                        <th>브랜드</th>

                        <th>재고</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="product : ${lowStockProducts}">

                        <td th:text="${product.name}"></td>

                        <td th:text="${product.brand}"></td>

                        <td>

                            <span class="stock-warning"
                                  th:text="${product.stock}">
                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

</body>

</html>
